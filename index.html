<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyMemory">
<meta name="theme-color" content="#E11D48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>MyMemory</title>
<style>
/* Tông màu hồng đỏ (--acc). Màu theo mức gần: đỏ = hôm nay, cam = còn 1–3 ngày, vàng = sắp đến */
:root{--acc:#E11D48;--acc2:#BE123C;--bg:#FFF5F7;--card:#fff;--text:#2B1720;--muted:#8A6B77;--line:#F3D9E1;--field:#FFF9FA;
  --today:#EF4444;--today-bg:#FEE2E2;--near:#F97316;--near-bg:#FFEDD5;--soon:#EAB308;--soon-bg:#FEF9C3;--danger:#DC2626;--ok:#16A34A}
@media (prefers-color-scheme:dark){
:root{--bg:#1A0F13;--card:#26171D;--text:#F6E9EE;--muted:#B9949F;--line:#3D2630;--field:#1F1217;
  --today-bg:#4A1616;--near-bg:#45250F;--soon-bg:#3D3510;--danger:#F87171}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
/* Nền: vệt màu hồng / tím nhạt */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 10% -5%,#FFD1DC 0,transparent 45%),radial-gradient(circle at 105% 35%,#EBD9FF 0,transparent 40%),radial-gradient(circle at 0% 100%,#FFE7D1 0,transparent 40%),var(--bg)}
@media (prefers-color-scheme:dark){body::before{background:radial-gradient(circle at 10% -5%,#4C0519 0,transparent 45%),radial-gradient(circle at 105% 35%,#2E1065 0,transparent 40%),var(--bg)}}
:root{--sh:0 3px 12px -5px rgba(190,18,60,.22)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

/* ===== Header + nội dung + thanh tab dưới ===== */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:linear-gradient(120deg,#FB7185,#E11D48 55%,#C026D3);color:#fff;box-shadow:0 4px 16px -6px rgba(190,18,60,.6)}
header img{width:32px;height:32px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{flex:1;margin:0;font-size:20px;font-weight:800}
header .hbtn{background:rgba(255,255,255,.22);border:0;color:#fff;height:36px;min-width:36px;border-radius:10px;font-size:17px;padding:0 10px}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){nav{background:rgba(38,23,29,.85)}}
nav button.on::before{content:'';position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav button span{transition:transform .2s}
nav button.on span{transform:scale(1.12)}
nav button{flex:1;border:0;background:none;padding:7px 0 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--acc);font-weight:700}
nav button.on span{filter:none;opacity:1}
nav button{position:relative}
nav button i{font-style:normal}
nav .dot{position:absolute;top:3px;left:calc(50% + 8px);background:var(--today);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px}

h2.sec{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(120deg,#F43F5E,#E11D48);border-color:transparent;color:#fff;box-shadow:0 4px 12px -4px rgba(225,29,72,.6)}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%;margin-top:10px}
.btn.small{padding:7px 12px;font-size:14px}

/* Thẻ "hôm nay" ở trên cùng */
.todaybox{position:relative;overflow:hidden;background:linear-gradient(135deg,#F43F5E,#D946EF 60%,#8B5CF6);border:0;color:#fff;padding:16px 16px 14px;
  box-shadow:0 8px 22px -10px rgba(190,18,60,.7)}
.todaybox::after{content:'🌙';position:absolute;right:-4px;top:-16px;font-size:90px;opacity:.2;transform:rotate(-15deg)}
.todaybox .big{font-size:21px;font-weight:800}
.todaybox .lunar{display:inline-block;margin-top:6px;background:rgba(255,255,255,.2);border-radius:20px;padding:2px 10px;font-size:14px}
.banner{margin-top:10px;border-radius:14px;padding:12px 14px;font-weight:700;animation:fadeUp .35s ease-out both}
.banner.today{background:linear-gradient(120deg,#EF4444,#F97316);color:#fff;animation:fadeUp .35s ease-out both,pulse 2.2s 1s infinite}
.banner.soon{background:var(--near-bg);color:var(--text);border:1px solid var(--near)}
.banner.none{background:var(--card);border:1px dashed var(--line);color:var(--muted);font-weight:500}

/* Thẻ 1 ngày cần nhớ */
.ev{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:16px;padding:10px 10px 10px 8px;margin:9px 0;
  box-shadow:var(--sh);animation:fadeUp .35s ease-out both;transition:transform .12s}
.ev:active{transform:scale(.98)}
.ev.today{background:linear-gradient(100deg,var(--today-bg),var(--card));border-color:var(--today)}
.ev.near{background:linear-gradient(100deg,var(--near-bg),var(--card));border-color:var(--near)}
.ev.soon{background:linear-gradient(100deg,var(--soon-bg),var(--card));border-color:var(--soon)}
.ev-date{flex:0 0 42px;text-align:center;line-height:1.1}
.ev-date b{display:block;font-size:22px}
.ev-date span,.ev-date small{display:block;font-size:11px;color:var(--muted)}
.ev-av{position:relative;flex:0 0 44px;height:44px}
.ev-av .avatar{width:44px;height:44px;flex:none;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ev-av .ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,#FFE4E6,#F3E8FF)}
@media (prefers-color-scheme:dark){.ev-av .ico{background:linear-gradient(135deg,#4C0519,#2E1065)}}
.ev-av .bd{position:absolute;right:-5px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--card);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ev-body{flex:1;min-width:0}
.ev-t{font-weight:700;line-height:1.3}
.ev-i{font-size:12px;color:var(--muted);margin-top:2px}
.ev-n{flex:0 0 auto;font-size:12px;font-weight:800;white-space:nowrap;border-radius:20px;padding:4px 9px;background:var(--line);color:var(--muted)}
.ev.today .ev-n{background:var(--today);color:#fff}
.ev.near .ev-n{background:var(--near);color:#fff}
.ev.soon .ev-n{background:var(--soon);color:#422006}

/* Danh sách người / ngày lễ */
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:var(--sh);animation:fadeUp .3s ease-out both}
.ico-s{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(135deg,#FFE4E6,#F3E8FF)}
@media (prefers-color-scheme:dark){.ico-s{background:linear-gradient(135deg,#4C0519,#2E1065)}}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:42px;height:42px;font-size:22px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.icons button.on{border:2px solid var(--acc);background:var(--today-bg)}
.grp{box-shadow:var(--sh)}
/* Khung nhỏ thông tin 1 người */
#pop{position:fixed;inset:0;z-index:30;background:rgba(20,8,14,.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.pop-in{position:relative;width:100%;max-width:340px;max-height:80vh;overflow:auto;background:var(--card);border-radius:22px;padding:8px 16px 12px;
  box-shadow:0 20px 40px -12px rgba(0,0,0,.45);animation:popIn .2s ease-out}
.pop-x{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;border-radius:50%;background:var(--line);font-size:15px}
.pv-top{text-align:center;padding:14px 0 6px}
.pv-top .avatar{width:84px;height:84px;flex:none;margin:0 auto;font-size:34px;box-shadow:0 6px 18px -6px rgba(190,18,60,.6);border:3px solid var(--card)}
.pv-top h2{margin:8px 0 6px;font-size:21px}
.pv-top .chip{margin:0 3px}
.info{padding:0}
.ir{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ir:first-child{border-top:0}
.ir .k{flex:0 0 28px;font-size:20px;line-height:1.3}
.ir .v{flex:1;min-width:0}
.ir .v .l{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ir .v small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ir .dn{color:var(--acc)}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:22px;padding:3px 12px 3px 3px;background:var(--field);font-size:14px;font-weight:600}
.pchip .avatar{width:30px;height:30px;flex:none;font-size:13px}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--muted)}
.row.off{opacity:.55}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:1px 8px;background:var(--line);color:var(--text);margin-left:6px;vertical-align:1px}
.chip.dead{background:#E5E7EB;color:#374151}
.avatar{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:var(--acc)}
.avatar.dead{background:#6B7280}
.search{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.avatar.m{background:#3B82F6}
.avatar.f{background:#EC4899}
img.avatar{object-fit:cover;width:40px;background:var(--line)}
img.avatar.dead{filter:grayscale(1)}
.avatar.big{flex:0 0 76px;width:76px;height:76px;font-size:30px}

/* Sơ đồ gia đình: mỗi cấp 1 hàng, cách nhau --tp (150px) */
.tree-out{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:8px -12px 10px}
.tree-box{position:relative;margin:0 auto}
.tree-wrap{position:absolute;left:0;top:0;transform-origin:0 0}
.tree-lv{position:absolute;left:0;right:0;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none;z-index:2}
.tree-lv span{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:6px}
.tree-lv button{pointer-events:auto;font-size:12px;font-weight:700;border:1px dashed var(--acc);color:var(--acc);background:var(--bg);border-radius:8px;padding:2px 10px}
.tree-sc{height:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.tree{display:flex;justify-content:center;align-items:flex-start;gap:12px;width:max-content;min-width:100%;padding:0 12px}
.tu{display:flex;flex-direction:column;align-items:center}
.uc{height:84px;display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:3px 2px}
.uc.me{border:2px solid #3B82F6}
.uc .hrt{color:var(--acc);font-size:11px}
.tp{width:64px;text-align:center;cursor:pointer}
.tp .avatar{width:40px;height:40px;margin:0 auto 2px;font-size:16px}
.tp .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tp .st{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tp .st .today{color:var(--today);font-weight:700}
.tp .st .near{color:var(--near);font-weight:700}
.tp .st .soon{color:#A16207;font-weight:700}
.vl{width:0;border-left:1.5px solid var(--muted)}
.kids{display:flex;align-items:flex-start}
.kid{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 6px}
.kid::before,.kid::after{content:'';position:absolute;top:0;width:50%;border-top:1.5px solid var(--muted)}
.kid::before{left:0}
.kid::after{right:0}
.kid:first-child::before,.kid:last-child::after{display:none}

/* Công tắc bật/tắt */
.sw{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:50px;height:30px;border-radius:15px;background:#D1D5DB;position:relative;transition:.2s;margin:0;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw:checked{background:var(--ok)}
.sw:checked::after{left:23px}

/* Form */
.f{display:block;margin:12px 0}
.f>.l{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.inp{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
textarea.inp{min-height:70px;resize:vertical}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin:14px 0}
.grp>h3{margin:10px 0 4px;font-size:16px}
.line{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:10px 0}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--acc)}
.dmy{display:flex;gap:6px;align-items:center}
.dmy input{flex:1;min-width:0;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.dmy input.y{flex:1.6}
.dmy select{flex:1;min-width:0;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.conv{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}
.conv.err{color:var(--danger)}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ph button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:3px 8px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.preview{font-size:14px;background:var(--soon-bg);border-radius:10px;padding:8px 10px;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px}
.chk input{width:20px;height:20px}

/* Bảng trượt lên (thêm / sửa) */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#sheet .sh-h{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line);background:var(--card)}
#sheet .sh-h h2{flex:1;text-align:center;margin:0;font-size:17px}
#sheet .sh-h button{border:0;background:none;font-size:16px;padding:8px 8px;color:var(--acc);font-weight:600}
#sheet .sh-h button.save{font-weight:800}
#sheet .sh-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(30px + env(safe-area-inset-bottom))}
#sheet .sh-b>div{max-width:720px;margin:0 auto}

/* Màn hình mã PIN */
#pin{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#FFE4E6,#FDF2F8);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){#pin{background:linear-gradient(180deg,#2A0A14,#1A0F13)}}
.pin-in{width:100%;max-width:330px;text-align:center}
.pin-in img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px -6px rgba(190,18,60,.6)}
.pin-in h2{margin:12px 0 4px;font-size:20px}
.pin-in p{margin:0;min-height:20px;font-size:14px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:14px;margin:20px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.dots i.f{background:var(--acc)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#pinM{color:var(--danger);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:14px 22px;margin-top:16px}
.pad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--card);font-size:28px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pad button:active{background:var(--line)}
.pad button.fn{background:none;box-shadow:none;font-size:15px;color:var(--acc);font-weight:700}
.pad button.fn.bio{font-size:30px}
.pad button:disabled{visibility:hidden}
.pin-cancel{margin-top:14px;border:0;background:none;color:var(--acc);font-weight:700;font-size:16px;padding:8px 18px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:rgba(30,20,25,.92);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- Màn hình chính (chỉ hiện sau khi mở khóa) -->
<div id="appScr" hidden>
  <header>
    <img src="icon-192.png" alt="">
    <h1>MyMemory</h1>
    <button class="hbtn" id="btnAdd" title="Thêm">＋</button>
    <button class="hbtn" id="btnLock" title="Khóa">🔒</button>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="up"><span>📅</span><i>Sắp tới</i></button>
    <button data-tab="people"><span>👪</span><i>Gia đình</i></button>
    <button data-tab="items"><span>🎉</span><i>Ngày lễ</i></button>
    <button data-tab="set"><span>⚙️</span><i>Cài đặt</i></button>
  </nav>
</div>

<!-- Bảng thêm / sửa -->
<div id="sheet" hidden>
  <div class="sh-h"><button id="shCancel">Hủy</button><h2 id="shTitle"></h2><button id="shSave" class="save">Lưu</button></div>
  <div class="sh-b"><div id="shBody"></div></div>
</div>

<!-- Màn hình nhập mã PIN -->
<div id="pin" hidden>
  <div class="pin-in">
    <img src="icon-192.png" alt="">
    <h2 id="pinT"></h2>
    <p id="pinS"></p>
    <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p id="pinM"></p>
    <div class="pad" id="pinPad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>

/* =====================================================================
   MÀN HÌNH MÃ PIN
   showPin({title, sub, check, bio, cancel}) → trả về mã PIN đã nhập (hoặc null nếu bấm Hủy)
   check(pin): trả về true nếu đúng, chuỗi thông báo nếu sai
   ===================================================================== */
let pinState = null;
function showPin(opt) {
  return new Promise(resolve => {
    pinState = { opt, buf: '', busy: false, resolve };
    $('#pinT').textContent = opt.title;
    $('#pinS').textContent = opt.sub || '';
    $('#pinM').textContent = '';
    const L = $('#pinL');
    L.disabled = !(opt.bio || opt.cancel);
    L.className = 'fn' + (opt.bio ? ' bio' : '');
    L.textContent = opt.bio ? '🙂' : 'Hủy';
    L.title = opt.bio ? 'Mở bằng Face ID' : 'Hủy';
    $('#pinX').hidden = !(opt.bio && opt.cancel);   // có nút Face ID thì nút Hủy nằm riêng bên dưới
    pinDots();
    $('#pin').hidden = false;
    if (opt.bio && opt.autoBio) setTimeout(pinBio, 300);
  });
}
function pinDots() { [...$('#pinDots').children].forEach((e, i) => e.classList.toggle('f', i < pinState.buf.length)); }
function pinClose(val) { const s = pinState; pinState = null; $('#pin').hidden = true; s.resolve(val); }
function pinShake(msg) {
  const d = $('#pinDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  $('#pinM').textContent = msg || '';
  if (navigator.vibrate) navigator.vibrate(150);
}
async function pinBio() {
  const s = pinState;
  if (!s || s.busy || !s.opt.bio) return;
  s.busy = true;
  const r = await s.opt.bio();
  s.busy = false;
  if (pinState !== s) return;
  if (r === true) pinClose('bio'); else $('#pinM').textContent = r || '';
}
async function pinKey(k) {
  const s = pinState;
  if (!s || s.busy) return;
  if (k === 'L') { if (s.opt.bio) pinBio(); else if (s.opt.cancel) pinClose(null); return; }
  if (k === 'B') { s.buf = s.buf.slice(0, -1); pinDots(); return; }
  if (s.buf.length >= 6) return;
  s.buf += k; pinDots();
  if (s.buf.length < 6) return;
  if (!s.opt.check) { const v = s.buf; setTimeout(() => pinClose(v), 120); return; }
  s.busy = true;
  const r = await s.opt.check(s.buf);
  s.busy = false;
  if (r === true) pinClose(s.buf);
  else { s.buf = ''; pinDots(); pinShake(r); }
}
$('#pinPad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pinKey(b.dataset.k); });
$('#pinX').onclick = () => { if (pinState && !pinState.busy && pinState.opt.cancel) pinClose(null); };
document.addEventListener('keydown', e => {
  if (!pinState) return;
  if (/^[0-9]$/.test(e.key)) pinKey(e.key);
  else if (e.key === 'Backspace') pinKey('B');
  else if (e.key === 'Escape' && pinState.opt.cancel) pinClose(null);
});

async function checkUnlock(pin) {
  const f = getFail();
  if (f.until > Date.now()) return `Nhập sai nhiều lần. Thử lại sau ${Math.ceil((f.until - Date.now()) / 1000)} giây.`;
  const raw = await tryPin(pin);
  if (!raw) {
    f.n++;
    if (f.n >= 5) { f.until = Date.now() + 30000 * Math.pow(2, Math.min(f.n - 5, 5)); }
    setFail(f);
    return f.n >= 5 ? `Sai mã PIN. Thử lại sau ${Math.round((f.until - Date.now()) / 1000)} giây.` : `Sai mã PIN (còn ${5 - f.n} lần thử).`;
  }
  await openWith(raw);
  setFail({ n: 0, until: 0 });
  return true;
}
async function askNewPin(title) {      // nhập mã mới 2 lần; trả về mã PIN hoặc null

    if (p2 === p1) return p1;
    if (p2 != null) toast('Hai lần nhập không giống nhau. Nhập lại từ đầu.');
  }
}

// Sơ đồ vừa màn hình: ít người thì phóng to (tối đa 1.8 lần), nhiều người thì thu nhỏ (tối thiểu 0.55 lần, quá nữa thì vuốt ngang)
function fitTree() {
  const out = $('.tree-out');
  if (!out) return;
  const box = out.firstElementChild, wrap = box.firstElementChild, tree = wrap.querySelector('.tree');
  wrap.style.transform = ''; wrap.style.width = 'max-content';
  const tw = tree.scrollWidth, H = wrap.offsetHeight;
  const availW = out.clientWidth;
  const availH = window.innerHeight - (out.getBoundingClientRect().top + window.scrollY) - $('nav').offsetHeight - 24;
  const s = Math.max(0.55, Math.min(1.8, availW / tw, Math.max(availH, 250) / H));
  const w = Math.max(tw, availW / s);    // sơ đồ hẹp hơn màn hình thì nằm giữa
  wrap.style.width = w + 'px'; wrap.style.transform = `scale(${s})`;
  box.style.width = w * s + 'px'; box.style.height = H * s + 'px';
  const me = $('.uc.me');
  if (me) {   // sơ đồ rộng hơn màn hình: cuộn ngang tới cặp "Tôi"
    const a = out.getBoundingClientRect(), b = me.getBoundingClientRect();
    out.scrollLeft += b.left + b.width / 2 - (a.left + a.width / 2);
  }
}

/* ----- Sơ đồ gia đình -----
   Chỉ người "đứng riêng" lưu cấp (lv). Con lấy cấp của bố/mẹ + 1, vợ/chồng lấy cấp của người kia.
   "Đơn vị" = 1 người + vợ/chồng của người đó (đứng cạnh nhau, nối bằng ❤). */
const TP = 150, TL = 26, TC = 84, TA = 32;   // khoảng cách giữa 2 cấp, chiều cao nhãn cấp, chiều cao thẻ, đường nối dưới thẻ
function treeInfo() {
  const byId = new Map(data.people.map(p => [p.id, p])), lv = new Map();
  const get = (p, d) => {
    if (lv.has(p.id)) return lv.get(p.id);
    let v = null;
    if (d < 60) {
      if (p.sp && byId.has(p.sp)) v = get(byId.get(p.sp), d + 1);
      else if (p.par && byId.has(p.par)) { const x = get(byId.get(p.par), d + 1); v = x == null ? null : x + 1; }
      else v = p.lv || null;
    }
    lv.set(p.id, v);
    return v;
  };
  data.people.forEach(p => get(p, 0));
  return { byId, lv };
}
const isHead = (p, T) => T.lv.get(p.id) != null && !(p.sp && T.byId.has(p.sp));
const headsAt = (T, L) => data.people.filter(p => isHead(p, T) && T.lv.get(p.id) === L);
const spousesOf = h => data.people.filter(x => x.sp === h.id);
const unitLabel = h => [h, ...spousesOf(h)].map(x => x.name).join(' và ');
function treeRows(T) { return Math.max(1, ...[...T.lv.values()].filter(Boolean)); }   // số cấp = cấp lớn nhất đang có người
function normalizeTree() {   // cấp 1 không có ai thì đẩy cả sơ đồ lên (luôn bắt đầu từ cấp 1)
  const T = treeInfo(), vals = [...T.lv.values()].filter(Boolean);
  if (!vals.length) return;
  const mn = Math.min(...vals);
  if (mn > 1) data.people.forEach(p => { if (isHead(p, T) && !(p.par && T.byId.has(p.par))) p.lv = T.lv.get(p.id) - (mn - 1); });
}
function sortP(list) {   // anh chị em: theo ô "thứ tự", rồi năm sinh, rồi thứ tự thêm vào
  const idx = new Map(data.people.map((p, i) => [p.id, i]));
  return list.sort((a, b) => (a.ord || 99) - (b.ord || 99) || ((a.birth && a.birth.y) || 9999) - ((b.birth && b.birth.y) || 9999) || idx.get(a.id) - idx.get(b.id));
}
function descendants(p) {   // p + vợ/chồng + con cháu (không được chọn làm bố mẹ của p)
  const s = new Set([p.id]);
  for (let grew = true; grew;) {
    grew = false;
    for (const x of data.people) if (!s.has(x.id) && (s.has(x.par) || s.has(x.sp))) { s.add(x.id); grew = true; }
  }
  return s;
}
function detach(p) {   // bỏ p khỏi sơ đồ: con và vợ/chồng của p chuyển thành "đứng riêng" ở cấp hiện tại
  const T = treeInfo();
  for (const x of data.people) if (x !== p && (x.par === p.id || x.sp === p.id)) { x.lv = T.lv.get(x.id); x.par = null; x.sp = null; }
}
// Sơ đồ chỉ để xem. Thêm / sửa / đổi cấp: vào Danh sách → bấm vào người → mục "Vị trí trong sơ đồ".
function viewTree(today) {
  const T = treeInfo(), rows = treeRows(T);
  const howTo = `Muốn thêm hoặc sửa: vào <b>📋 Danh sách</b>, bấm vào người đó, chọn cấp ở mục <b>🌳 Vị trí trong sơ đồ</b> rồi bấm <b>Lưu</b>.`;
  if (![...T.lv.values()].some(Boolean)) {
    return `<div class="card" style="margin-top:12px"><b>Chưa có ai trong sơ đồ</b><p class="muted">${howTo}
      Cấp 1 là hàng trên cùng (ví dụ bố mẹ). Đánh dấu "Người này là tôi" để ô của anh có viền xanh.</p></div>`;
  }
  const occ = new Map();   // người đang có sinh nhật / ngày giỗ sắp đến
  for (const o of allOcc(today)) if (o.src.p && o.days <= o.soon && !occ.has(o.src.p.id)) occ.set(o.src.p.id, o);
  const roots = sortP(data.people.filter(p => isHead(p, T) && !(p.par && T.byId.has(p.par)))).sort((a, b) => T.lv.get(a.id) - T.lv.get(b.id));
  // tree-out: khung cuộn ngang; tree-box: kích thước sau khi phóng to/thu nhỏ; tree-wrap: sơ đồ kích thước gốc (fitTree() tính tỉ lệ)
  let h = `<div class="tree-out"><div class="tree-box"><div class="tree-wrap" style="height:${rows * TP - TP + TL + TC + 8}px">`;
  for (let L = 1; L <= rows; L++) h += `<div class="tree-lv" style="top:${(L - 1) * TP}px"><span>Cấp ${L}</span></div>`;
  h += `<div class="tree">` + roots.map(r => `<div style="margin-top:${TL + (T.lv.get(r.id) - 1) * TP}px">${unitHtml(r, T, occ)}</div>`).join('') + `</div></div></div></div>`;
  const un = data.people.filter(p => T.lv.get(p.id) == null);
  if (un.length) h += `<h2 class="sec">Chưa xếp vào sơ đồ</h2>` + un.map(p => personRow(p, today, true)).join('');
  return h;
}
function unitHtml(h, T, occ) {
  const mem = [h, ...spousesOf(h)];
  const kids = sortP(data.people.filter(x => x.par === h.id && isHead(x, T)));
  let s = `<div class="uc${mem.some(m => m.me) ? ' me' : ''}">` + mem.map((m, i) => (i ? '<span class="hrt">❤</span>' : '') + tpHtml(m, occ)).join('') + '</div>';
  if (kids.length) s += `<div class="vl" style="height:${TA}px"></div><div class="kids">` +
    kids.map(k => `<div class="kid"><div class="vl" style="height:${TP - TC - TA}px"></div>${unitHtml(k, T, occ)}</div>`).join('') + '</div>';
  return `<div class="tu">${s}</div>`;
}
function tpHtml(p, occ) {

  const st = o ? `<span class="${o.cls}">${o.src.kind === 'd' ? '🕯️' : '🎂'} ${o.days === 0 ? 'Hôm nay' : 'còn ' + o.days + ' ngày'}</span>`

function dateBoxGet(key, required) {
  const box = $('#db_' + key), c = box.dataset.c, q = s => box.querySelector(s);
  if (c === 'w') return { ok: true, dt: { c: 'w', wd: +q('.wd').value, n: +q('.n').value, m: +q('.wm').value, y: null } };
  const raw = [q('.d').value.trim(), q('.m').value.trim(), q('.y').value.trim()];
  if (!raw[0] && !raw[1] && !raw[2]) return required ? { ok: false, err: 'Chưa nhập ngày.' } : { ok: true, dt: null };
  const [d, m, y] = raw.map(s => s === '' ? null : parseInt(s, 10));
  if (!d || !m) return { ok: false, err: 'Cần nhập ngày và tháng.' };
  if (m < 1 || m > 12) return { ok: false, err: 'Tháng phải từ 1 đến 12.' };
  if (y != null && (y < 1850 || y > 2150)) return { ok: false, err: 'Năm phải từ 1850 đến 2150 (hoặc để trống).' };
  const lp = c === 'l' && q('.lp').checked;
  if (c === 's') {
    if (d < 1 || d > dim(m, y || 2000)) return { ok: false, err: `Tháng ${m} không có ngày ${d}.` };
  } else {
    if (d < 1 || d > 30) return { ok: false, err: 'Ngày âm lịch phải từ 1 đến 30.' };
    if (y != null) {
      const s = lunar2solar(d, m, y, lp ? 1 : 0);
      if (!s[0]) return { ok: false, err: `Năm âm ${y} không có tháng ${m} nhuận.` };
      if (solar2lunar(s[0], s[1], s[2])[0] !== d) return { ok: false, err: `Tháng ${m} âm năm ${y} chỉ có 29 ngày.` };
    }
  }
  return { ok: true, dt: { c, d, m, y, lp } };
}
function dateBoxConv(key) {   // hiện ngày quy đổi bên dưới ô nhập
  const box = $('#db_' + key), cv = box.querySelector('.conv'), r = dateBoxGet(key, false);

  if (dt.c === 's') { cv.textContent = dt.y ? '' : 'Không nhập năm thì không tính được tuổi / số năm.'; return; }
  // Âm lịch: hiện thêm ngày dương lịch (của năm đã nhập và của lần sắp tới)
  const parts = [];

  cv.innerHTML = parts.map(esc).join('<br>');
}

// Ảnh: cắt vuông giữa ảnh, thu nhỏ còn 200x200 (JPEG) rồi lưu chung với dữ liệu (đã mã hóa)
function loadPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 200, c = document.createElement('canvas'), m = Math.min(img.width, img.height);
      c.width = c.height = S;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

  };
}
// Xác nhận bằng Face ID (không mở khóa lại, chỉ kiểm tra đúng chủ máy) – dùng khi quên mã PIN
async function verifyBio() {
  try {
    const out = await bioGet(unb64(vault.bio.id), unb64(vault.bio.salt));
    if (!out) return 'Không lấy được khóa từ Face ID.';
    await aesDec(await bioKek(out), vault.bio.w);   // giải được = đúng Face ID của máy này
    return true;
  } catch (e) { return bioErr(e); }
}
async function changePin() {
  // xác nhận bằng mã PIN hiện tại, hoặc Face ID (nếu đã bật) khi quên mã PIN
  const old = await showPin({ title: 'Nhập mã PIN hiện tại', sub: vault.bio ? 'Quên mã PIN: bấm 🙂 để xác nhận bằng Face ID' : '',
    cancel: true, bio: vault.bio ? verifyBio : null, check: async p => (await tryPin(p)) ? true : 'Sai mã PIN.' });
  if (old == null) return;
  const pin = await askNewPin('Nhập mã PIN mới');
  if (pin == null) return;
  const salt = rand(16);
  vault.salt = b64(salt); vault.iter = ITER;
  vault.w = await aesEnc(await pinKek(pin, salt, ITER), rawKey);
  saveVault();
  toast('Đã đổi mã PIN');
}

/* ----- Lưu file (sao lưu, lịch) ----- */
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

  const [d, m, y] = jdToDate(todayJd());
  const bak = { app: 'MyMemory', v: 1, created: new Date().toISOString(), salt: vault.salt, iter: vault.iter, w: vault.w, data: vault.data };
  await shareFile(`MyMemory-${y}${String(m).padStart(2, '0')}${String(d).padStart(2, '0')}.json`, JSON.stringify(bak), 'application/json');
}
async function restore(file) {
  let bak;
  try { bak = JSON.parse(await file.text()); } catch (e) { return alert('File không đúng định dạng.'); }
  if (!bak || bak.app !== 'MyMemory' || !bak.w || !bak.data) return alert('Đây không phải file sao lưu của MyMemory.');
  let got = null;
  const pin = await showPin({ title: 'Mã PIN của bản sao lưu', sub: 'Nhập mã PIN lúc tạo bản sao lưu', cancel: true, check: async p => {
    try {
      const raw = await aesDec(await pinKek(p, unb64(bak.salt), bak.iter), bak.w);
      got = fixData(JSON.parse(td.decode(await aesDec(await importData(raw), bak.data))));
      return true;
    } catch (e) { return 'Sai mã PIN.'; }
  } });
  if (pin == null || !got) return;
  if (!confirm(`Bản sao lưu có ${got.people.length} người, ${got.items.length} ngày lễ.\nThay toàn bộ dữ liệu hiện tại bằng bản này?`)) return;
  data = got;
  await save(); render(); toast('Đã khôi phục');
}

/* ----- Xuất file lịch .ics ----- */
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
function icsFold(line) {    // mỗi dòng tối đa 75 byte (UTF-8)
  let out = '', n = 0;
  for (const ch of line) {
    const b = te.encode(ch).length;
    if (n + b > 74) { out += '\r\n '; n = 1; }
    out += ch; n += b;
  }
  return out;
}
function icsDur(min) {      // số phút (âm = trước) → -P6DT17H0M
  const sign = min < 0 ? '-' : '', a = Math.abs(min);
  return `${sign}P${INT(a / 1440)}DT${INT((a % 1440) / 60)}H${a % 60}M`;
}
async function exportIcs() {
  const s = data.settings, today = todayJd(), endJd = today + 366 * s.icsYears;
  const [hh, mm] = (s.icsTime || '07:00').split(':').map(Number), tmin = hh * 60 + (mm || 0);
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MyMemory//VI', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:MyMemory'];
  let count = 0;
  for (const src of sources(false)) {
    const base = src.dt.c === 'l' ? lunarOf(today)[2] : jdToDate(today)[2];
    for (let yr = base - 1; yr <= base + s.icsYears + 1; yr++) {
      if (src.dt.y && yr < src.dt.y) continue;
      const jd = occForYear(src.dt, yr);
      if (jd == null || jd < today || jd > endJd) continue;
      const o = { jd, yr }, v = varsOf(src, o, 0), D = DEF[src.kind], soon = soonOf(src.r);
      const title = (src.it ? itemIcon(src.it) : ICON[src.kind]) + ' ' + fill(D.l, v);
      L.push('BEGIN:VEVENT', `UID:${src.kind}-${src.id}-${yr}@mymemory`, `DTSTAMP:${now}`,
        `DTSTART;VALUE=DATE:${ymd(jd)}`, `DTEND;VALUE=DATE:${ymd(jd + 1)}`, 'TRANSP:TRANSPARENT', 'SUMMARY:' + icsEsc(title));
      if (!s.icsShort) {
        const desc = [fill(src.r.t || D.t, v), mkOcc(src, o, jd).info, (src.p ? src.p.note : src.it.note) || ''].filter(Boolean).join('\n');
        L.push('DESCRIPTION:' + icsEsc(desc));
      }
      if (soon > 0) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(fill(src.r.s || D.s, Object.assign({}, v, { n: soon }))), 'TRIGGER:' + icsDur(-soon * 1440 + tmin), 'END:VALARM');
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(fill(src.r.t || D.t, v)), 'TRIGGER:' + icsDur(tmin), 'END:VALARM', 'END:VEVENT');
      count++;
    }
  }
  L.push('END:VCALENDAR');
  if (!count) return alert('Không có ngày nào đang bật nhắc.');
  if (!confirm(`Tạo file lịch gồm ${count} sự kiện (${s.icsYears} năm tới)?\n\nSau đó chọn "Lưu vào Tệp", rồi mở file trong app Tệp → "Thêm tất cả".`)) return;
  await shareFile('MyMemory.ics', L.map(icsFold).join('\r\n') + '\r\n', 'text/calendar');
}

/* ----- Số trên icon app ----- */
function updateBadge() {
  if (!data || !navigator.setAppBadge) return;
  if (!data.settings.badge) return;
  const today = todayJd(), n = allOcc(today).filter(o => o.days <= o.soon).length;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
start();
